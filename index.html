<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumen - Table Lamp</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-950 text-white flex items-center justify-center p-5">

  <main class="w-full max-w-sm rounded-3xl border border-slate-800
               bg-slate-900 p-7 shadow-2xl">

    <header class="text-center mb-8">
      <p class="text-amber-400 text-xs tracking-[0.4em] mb-2">
        L U M E N
      </p>
      <h1 class="text-3xl font-bold">Table Lamp</h1>
      <p class="text-slate-400 text-sm mt-2">
        Set the mood with a click.
      </p>
    </header>

    <!-- Lamp Area -->
    <section id="lamp-area"
      class="relative h-72 rounded-2xl bg-slate-950
             flex flex-col items-center justify-end overflow-hidden pb-5">

      <!-- Light beam -->
      <div id="light-beam"
        class="absolute top-20 w-48 h-40
               bg-amber-300/0 blur-2xl
               transition-all duration-500"
        style="clip-path: polygon(30% 0, 70% 0, 100% 100%, 0 100%)">
      </div>

      <!-- Lamp Shade -->
      <div id="lamp-shade"
        class="relative z-10 w-36 h-16
               bg-gradient-to-b from-slate-500 to-slate-700
               rounded-t-[5rem] rounded-b-xl
               border border-slate-500
               transition-all duration-500"
        style="clip-path: polygon(18% 0,82% 0,100% 100%,0 100%)">
      </div>

      <!-- Shade bottom rim -->
      <div id="lamp-rim"
        class="relative z-10 w-36 h-2 rounded-full
               bg-slate-600 transition-all duration-500">
      </div>

      <!-- Lamp stand -->
      <div class="relative z-10 w-3 h-20
                  bg-gradient-to-r from-slate-600
                  via-slate-400 to-slate-700">
      </div>

      <!-- Lamp base -->
      <div class="relative z-10 w-28 h-4
                  bg-gradient-to-b from-slate-400
                  to-slate-700 rounded-[50%]">
      </div>

      <!-- Table surface -->
      <div class="absolute bottom-4 w-full h-px bg-slate-700"></div>

    </section>

    <!-- Status -->
    <div class="flex items-center justify-between mt-6 mb-4">
      <span class="text-sm text-slate-400">Power Status</span>
      <span id="light-status"
        class="text-xs font-bold tracking-widest text-slate-500">
        OFF
      </span>
    </div>

    <!-- Toggle Button -->
    <button id="toggle-btn"
      class="w-full py-4 rounded-xl bg-amber-400
             hover:bg-amber-300 active:scale-95
             text-slate-950 font-bold
             transition-all duration-200">
      TURN ON
    </button>

   

  </main>

  <script src="index.js"></script>
</body>
</html>
